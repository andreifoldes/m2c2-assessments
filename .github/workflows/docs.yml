# docs.yml — rebuilds the parameter reference whenever a task changes.
#
# The generator (website/scripts/generate-docs.mjs) extracts URL parameter
# schemas straight from the task source code, so the published docs at
# https://andreifoldes.github.io/m2c2-assessments/docs/ always match what is
# deployed. The built site is committed to docs/ on main, which GitHub Pages
# serves alongside the assessments (legacy Pages build, main branch, / root).
#
# Loop safety: the bot commit only touches docs/**, which is not in the
# `paths` filter below, so the workflow does not retrigger itself.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "assessments/**"
      - "dist/assessments/**"
      - "dist/modules/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "assessments/**"
      - "dist/assessments/**"
      - "dist/modules/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Generate and build docs
        working-directory: website
        run: npm run build

      - name: Sync built site into docs/
        if: github.event_name != 'pull_request'
        # docs/superpowers holds internal plans/specs — keep it out of the sync
        run: rsync -a --delete --exclude=superpowers website/build/ docs/

      - name: Commit and push updated docs
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Docs are up to date."
          else
            git commit -m "docs: regenerate URL parameter reference"
            git pull --rebase origin main
            git push
          fi

      - name: Verify Pages build (legacy builds fail transiently; retry once)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 30
          retried=0
          for i in $(seq 1 40); do
            s=$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '.status' || echo unknown)
            echo "Pages build status: $s"
            case "$s" in
              built)
                exit 0;;
              errored)
                if [ "$retried" -eq 0 ]; then
                  retried=1
                  echo "Requesting a Pages rebuild..."
                  gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null
                  sleep 30
                else
                  echo "Pages build failed again after retry." >&2
                  exit 1
                fi;;
              *)
                sleep 10;;
            esac
          done
          echo "Timed out waiting for the Pages build." >&2
          exit 1
